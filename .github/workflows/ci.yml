name: CI

on:
  push:
    branches: [main, 'vibe/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run workout engine tests
        run: npm test
      - name: Syntax-check all JS modules
        run: |
          fail=0
          for f in sw.js $(find js -name '*.js' | sort); do
            node --input-type=module --check < "$f" || fail=1
          done
          exit $fail
